name: Tuya Energy Backfill

on:
  workflow_dispatch: # Se ejecuta a mano, una sola vez cuando se necesite

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer histórico de Tuya
        env:
          API_ID: ${{ secrets.API_ID }}
          API_SECRET: ${{ secrets.API_SECRET }}
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
        run: python backfill.py

      - name: Guardar cambios en el CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Backfill del histórico de consumo desde Tuya'
          file_pattern: 'historico_energia.csv'
